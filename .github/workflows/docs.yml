# 构建 MkDocs 站点并发布到 GitHub Pages
# 仓库设置：Settings → Pages → Build and deployment → Source 必须选择 "GitHub Actions"
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一份部署，新推送会取消正在进行的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 仅安装文档依赖（避免触发 C++/CUDA 全量构建）
      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.5.49

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
