# Build MkDocs sites and publish to GitHub Pages
# Two sites: mkdocs.zh-CN.yml builds docs/cn → /cn, mkdocs.yml builds docs/en → /en;
# the root path hosts docs/index.html (language redirect page), all three merged into one Pages artifact.
# Repo settings: Settings → Pages → Build and deployment → Source must be set to "GitHub Actions"
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs*.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels the in-progress one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install doc dependencies only (avoid triggering the full C++/CUDA build)
      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.5.49

      - name: Build sites (cn + en)
        run: |
          mkdocs build --strict -f mkdocs.zh-CN.yml -d build/cn
          mkdocs build --strict -f mkdocs.yml -d build/en
          mkdir -p site
          cp -r build/cn site/cn
          cp -r build/en site/en
          cp docs/site/index.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
