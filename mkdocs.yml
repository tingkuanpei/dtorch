# DTorch documentation site config (MkDocs + Material) — English site (default config)
# Deployed as two sites: this file builds docs/en → /en; mkdocs.zh-CN.yml builds docs/cn → /cn.

site_name: DTorch Docs
site_description: An easy-to-use distributed inference API for PyTorch based on Single-Controller and Distributed Tensor
site_author: Pei Tingkuan
site_url: https://tingkuanpei.github.io/dtorch/en/
docs_dir: docs/en

# Repository (GitHub)
repo_url: https://github.com/tingkuanpei/dtorch
repo_name: tingkuanpei/dtorch
edit_uri: edit/main/docs/en/

theme:
  name: material
  language: en
  icon:
    logo: material/function-variant
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.expand
    - navigation.path
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Noto Sans SC
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tingkuanpei/dtorch

nav:
  - DTorch: index.md
